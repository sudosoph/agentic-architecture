name: Official Zero-Ban Cross-Post & Canonical Syndication

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Published post slug (e.g. ai-org-chart or loop-engineering)'
        required: true
        type: string
      platforms:
        description: 'Comma-separated official targets (all, or devto,hashnode,bluesky,linkedin,webhook)'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Generate crosspost-pack.json without calling external APIs'
        required: false
        default: 'true'
        type: string
      force:
        description: 'Bypass 24h Google canonical indexing grace window'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Official API Cross-Post Engine
        env:
          SLUG: ${{ inputs.slug }}
          PLATFORMS: ${{ inputs.platforms }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          SOCIAL_QUEUE_WEBHOOK_URL: ${{ secrets.SOCIAL_QUEUE_WEBHOOK_URL }}
        run: |
          FLAGS="--platforms=${PLATFORMS:-all}"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then FLAGS="$FLAGS --force"; fi
          node scripts/crosspost-official.mjs "$SLUG" $FLAGS

      - name: Commit updated crosspost pack & idempotency ledger
        run: |
          if [ -z "$(git status --porcelain content/social/ content/queue/crosspost-ledger.json)" ]; then
            echo "No new ledger or social pack changes to commit."
            exit 0
          fi
          git config user.name "Agentic Architect Syndicator"
          git config user.email "actions@users.noreply.github.com"
          git add content/social/ content/queue/crosspost-ledger.json
          git commit -m "chore(crosspost): record official syndication pack for ${{ inputs.slug }}"
          git push origin HEAD:main
