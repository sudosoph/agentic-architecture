# Triggered via workflow_dispatch or repository_dispatch whenever BSW workshop
# materials update. Syncs content via scripts/sync-bsw.mjs, runs the Brand & SEO
# quality gate, builds the site, and deploys to Cloudflare Workers.

name: Redeploy on BSW update

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bsw-content-updated]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v5

      - name: Checkout bsw content into bsw-content/
        if: ${{ vars.BSW_REPO != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BSW_REPO }}
          path: bsw-content
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (sync-bsw + manifests + next + opennext)
        run: npm run build

      - name: Run Brand & SEO Quality Gate
        run: npm run qc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
