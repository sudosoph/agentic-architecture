name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'content/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Compile Sovereign Stack book & field manuals
        run: npm run book:build

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_nBwAJrL9x6joAA2UJLnkHvd9pw8wbfMASXmC2hLRfjdd
          NEXT_PUBLIC_POSTHOG_HOST: /ingest

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_NEXT_DEPLOY: 'true'

      - name: Ping IndexNow with canonical URLs
        run: npm run seo:ping
        continue-on-error: true
